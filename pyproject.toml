[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-vis-pruning"
version = "0.1.0"
description = "Deterministic detail/foreground/background visual-token pseudo-label generation"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy==1.26.4",
  "Pillow==12.2.0",
  "PyYAML>=6.0,<7",
  "pycocotools>=2.0.7,<3",
  "matplotlib>=3.7,<4",
  "opencv-python>=4.8,<5",
  "torch==2.5.1",
  "transformers==4.50.0",
  "qwen-vl-utils>=0.0.8,<0.1",
  "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git@6fdee8f2727f4506cfbbe553e23b895e27956588",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

