project:
  name: mask-gaze-1k-offline-data
  seed: 42
  sample_count: 1000

paths:
  gaze_root: /home/ruimeng/gaze
  training_manifest: /home/bbhan/gaze/viscot_mix_20k_30-15-15-10-5-5-5-5-5_seed42.jsonl
  image_root: /data/DataSet/vlm_dataset/cot_image_data
  qwen_checkpoint: /data/ModelZoo/LVLM/Qwen-Qwen2.5-VL-7B-Instruct
  sam_checkpoint: /data/ModelZoo/CV/SAM/sam_vit_h_4b8939.pth
  pilot_manifest: outputs/pilot_200/manifest.jsonl
  output_dir: outputs/mask_gaze_1k

data:
  required_split: train
  image_prefix_to_strip: cot/
  short_answer_suffix: "\nAnswer the question using a single word or phrase."
  exclude_pilot_images: true
  quotas:
    gqa: 600
    v7w: 200
    flickr30k: 200

sam:
  model_type: vit_h
  device: cuda:0
  stability_offset: 1.0
  subject_min_bbox_coverage: 0.05
  subject_max_image_area: 0.95
  subject_min_image_area: 0.00002

qwen:
  device: cpu
  min_pixels: 3136
  max_pixels: 401408
  patch_size: 14
  spatial_merge_size: 2
  use_fast: false

supervision:
  adaptive_mass_target: 0.90
  reliable_background_max_coverage: 0.01
  foreground_label: 1
  background_label: 0
  ignore_label: -1

visualization:
  count: 30
  dpi: 110

runtime:
  resume: true
  deterministic_algorithms: false
  log_every: 1
